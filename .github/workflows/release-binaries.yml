name: Release Binaries

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            archive_ext: tar.gz
          - os: macos-14
            label: macos-arm64
            archive_ext: tar.gz
          - os: macos-13
            label: macos-x64
            archive_ext: tar.gz
          - os: windows-latest
            label: windows-x64
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: rez-node

      - name: Checkout pinned rez-core
        uses: actions/checkout@v4
        with:
          repository: rezprotocol/rez-core
          path: rez-core
          ref: a34ebd890bf88d4904012fb3d7dbf10511a69b94

      - name: Checkout pinned rez-sdk
        uses: actions/checkout@v4
        with:
          repository: rezprotocol/rez-sdk
          path: rez-sdk
          ref: cd993439f7bc48fd2c82cd8e706ceb83d903ab5c

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: |
          cp rez-node/release/workspace-package.json package.json
          cp rez-node/release/workspace-package-lock.json package-lock.json
          npm ci --ignore-scripts

      - name: Test
        run: npm test
        working-directory: rez-node

      - name: Ensure tag matches package version
        run: node ./scripts/ensure-tag-version.mjs
        working-directory: rez-node

      - name: Build SEA binary
        run: node ./scripts/build-sea.mjs
        working-directory: rez-node

      - name: Prepare archive name (bash)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: rez-node
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARCHIVE=rez-node-${VERSION}-${{ matrix.label }}.${{ matrix.archive_ext }}" >> "$GITHUB_ENV"
          echo "BUILT_DIR=$(find dist -maxdepth 1 -type d -name "rez-node-${VERSION}-*" | head -n 1)" >> "$GITHUB_ENV"

      - name: Prepare archive name (powershell)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: rez-node
        run: |
          $version = "${env:GITHUB_REF_NAME}".Substring(1)
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARCHIVE=rez-node-$version-${{ matrix.label }}.${{ matrix.archive_ext }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $builtDir = (Get-ChildItem -Path "dist" -Directory -Filter "rez-node-$version-*" | Select-Object -First 1).FullName
          "BUILT_DIR=$builtDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Archive binary (linux)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: rez-node
        run: |
          tar -czf "$ARCHIVE" -C "$BUILT_DIR" .

      - name: Archive binary (macos)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: rez-node
        run: |
          tar -czf "$ARCHIVE" -C "$BUILT_DIR" .

      - name: Archive binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: rez-node
        run: |
          Compress-Archive -Path "$env:BUILT_DIR/*" -DestinationPath "$env:ARCHIVE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: rez-node/${{ env.ARCHIVE }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: rez-node/${{ env.ARCHIVE }}

  update_homebrew_tap:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout rez-node
        uses: actions/checkout@v4

      - name: Ensure tag matches package version
        run: node ./scripts/ensure-tag-version.mjs

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download macOS arm64 asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern "rez-node-${VERSION}-macos-arm64.tar.gz"

      - name: Compute sha256
        run: |
          SHA="$(sha256sum "rez-node-${VERSION}-macos-arm64.tar.gz" | awk '{print $1}')"
          echo "SHA256=$SHA" >> "$GITHUB_ENV"

      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          repository: rezprotocol/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        run: |
          mkdir -p tap/Formula
          cat > tap/Formula/rez-node.rb <<EOF
          class RezNode < Formula
            desc "Rez node runtime CLI"
            homepage "https://github.com/rezprotocol/rez-node"
            url "https://github.com/rezprotocol/rez-node/releases/download/v${VERSION}/rez-node-${VERSION}-macos-arm64.tar.gz"
            sha256 "${SHA256}"
            version "${VERSION}"
            license "Apache-2.0"

            def install
              bin.install "rez-node"
            end

            test do
              output = shell_output("#{bin}/rez-node version").strip
              assert_match "${VERSION}", output
            end
          end
          EOF

      - name: Commit and push formula update
        run: |
          cd tap
          git config user.name "rezprotocol-bot"
          git config user.email "bot@rezprotocol.org"
          git add Formula/rez-node.rb
          if git diff --cached --quiet; then
            echo "No formula changes."
            exit 0
          fi
          git commit -m "rez-node ${VERSION}"
          git push
