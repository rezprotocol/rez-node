# Non-sticky round-robin LB across the cluster nodes — the property the whole
# job is built to survive. NO ip_hash / sticky sessions: a client may land on a
# different node on every (re)connect, and shared Pg + Redis must make that
# lossless.
events {}

http {
  upstream rez_nodes {
    # Plain round-robin = non-sticky.
    server node1:8787;
    server node2:8787;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  server {
    # WARNING: plain listener. 8443 conventionally implies TLS — this reference
    # config does NOT terminate it. Production MUST add `ssl` + certs here, or put
    # a TLS terminator in front. Account-auth handshakes + ciphertext metadata
    # (which inbox, timing, sizes) must not cross the WAN in the clear.
    listen 8443;

    location / {
      proxy_pass http://rez_nodes;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
    }
  }
}
