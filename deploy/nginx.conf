events {}

http {
  # Docker service addresses can change whenever a node image is replaced. Resolve them at
  # runtime so a long-lived load balancer does not retain dead container IPs across an upgrade.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream rez_nodes {
    zone rez_nodes 64k;
    server node1:8787 resolve;
    server node2:8787 resolve;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  server {
    listen 8443 ssl;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # Metrics contain only aggregate counters, but they are still operational data. Scrapers reach
    # node1:8787/metrics and node2:8787/metrics on the private edge network; never publish them.
    location = /metrics {
      return 404;
    }

    location / {
      proxy_pass http://rez_nodes;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 5s;
      proxy_read_timeout 3600s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }
  }
}
