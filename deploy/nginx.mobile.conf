# Included inside the existing TLS server only by the mobile Compose overlay.
location = /mobile/ws {
  set $portable_upstream portable1:8787;
  proxy_pass http://$portable_upstream/ws;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_connect_timeout 5s;
  proxy_read_timeout 3600s;
}

location = /mobile/ready {
  set $portable_upstream portable1:8787;
  proxy_pass http://$portable_upstream/ready;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
}
