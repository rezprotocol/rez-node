name: rez-hosted

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PG_USER:-rez}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD must be set}
      POSTGRES_DB: ${PG_DB:-rez}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-rez} -d ${PG_DB:-rez}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: ../..
      dockerfile: rez-node/deploy/Dockerfile
    command: ["node", "src/cli/index.js", "migrate"]
    environment:
      REZ_PG_URL: postgres://${PG_USER:-rez}:${PG_PASSWORD:?PG_PASSWORD must be set}@postgres:5432/${PG_DB:-rez}
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

  node1:
    &node
    build:
      context: ../..
      dockerfile: rez-node/deploy/Dockerfile
    environment:
      REZ_NODE_CONFIG: /etc/rez/rez-node.config.json
      REZ_STORAGE_BACKEND: postgres
      REZ_PG_URL: postgres://${PG_USER:-rez}:${PG_PASSWORD:?PG_PASSWORD must be set}@postgres:5432/${PG_DB:-rez}
      REZ_STORAGE_ENCRYPTION_KEY: ${REZ_STORAGE_ENCRYPTION_KEY:?REZ_STORAGE_ENCRYPTION_KEY must be set}
      REZ_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REZ_ADVERTISED_HOST: ${ADVERTISED_HOST:?ADVERTISED_HOST must be set}
      REZ_ADVERTISED_PORT: ${NODE1_RELAY_PORT:-4201}
      REZ_KNOWN_RELAYS_JSON: "${REZ_KNOWN_RELAYS_JSON:-[]}"
      REZ_REQUIRE_KNOWN_RELAYS: "${REZ_REQUIRE_KNOWN_RELAYS:-1}"
    volumes:
      - ./rez-node.config.json:/etc/rez/rez-node.config.json:ro
      - ${TLS_CERT_PATH:?TLS_CERT_PATH must point to a PEM certificate}:/etc/rez/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:?TLS_KEY_PATH must point to its PEM private key}:/etc/rez/tls/privkey.pem:ro
      - node1data:/data
    networks: [edge, data]
    ports:
      - "${NODE1_RELAY_PORT:-4201}:4201"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  node2:
    <<: *node
    environment:
      REZ_NODE_CONFIG: /etc/rez/rez-node.config.json
      REZ_STORAGE_BACKEND: postgres
      REZ_PG_URL: postgres://${PG_USER:-rez}:${PG_PASSWORD:?PG_PASSWORD must be set}@postgres:5432/${PG_DB:-rez}
      REZ_STORAGE_ENCRYPTION_KEY: ${REZ_STORAGE_ENCRYPTION_KEY:?REZ_STORAGE_ENCRYPTION_KEY must be set}
      REZ_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REZ_ADVERTISED_HOST: ${ADVERTISED_HOST:?ADVERTISED_HOST must be set}
      REZ_ADVERTISED_PORT: ${NODE2_RELAY_PORT:-4202}
      REZ_KNOWN_RELAYS_JSON: "${REZ_KNOWN_RELAYS_JSON:-[]}"
      REZ_REQUIRE_KNOWN_RELAYS: "${REZ_REQUIRE_KNOWN_RELAYS:-1}"
    volumes:
      - ./rez-node.config.json:/etc/rez/rez-node.config.json:ro
      - ${TLS_CERT_PATH:?TLS_CERT_PATH must point to a PEM certificate}:/etc/rez/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:?TLS_KEY_PATH must point to its PEM private key}:/etc/rez/tls/privkey.pem:ro
      - node2data:/data
    ports:
      - "${NODE2_RELAY_PORT:-4202}:4201"

  lb:
    image: nginx:1.27-alpine
    ports:
      - "${LB_PORT:-8443}:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_PATH:?TLS_CERT_PATH must point to a PEM certificate}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:?TLS_KEY_PATH must point to its PEM private key}:/etc/nginx/tls/privkey.pem:ro
    networks: [edge]
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1:8443/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  data:
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  pgdata: {}
  node1data: {}
  node2data: {}
