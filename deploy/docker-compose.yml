# Reference deployment for a hosted Rez home cluster (Job 1 / S5).
#
# Stands up Postgres + Redis + N rez-node behind a non-sticky round-robin LB.
# Migrations run once on first boot (the `migrate` one-shot) before any node
# starts, guarded by a Postgres advisory lock so the runner is safe even if
# multiple migrators race.
#
# Status: postgres, redis, and migrate are fully working. The backend-select
# seam has landed — REZ_STORAGE_BACKEND=postgres + REZ_PG_URL + the shared
# REZ_STORAGE_ENCRYPTION_KEY put a node on shared Postgres (the CLI bridges these
# env vars into config). NOT YET WIRED (S5): `rez-node start` still reads a
# config FILE (rez-node.config.json) which these services do not yet mount or
# generate, and REZ_NODE_ID/REZ_ADVERTISED_HOST have no env bridge — so the
# node* services need a mounted/generated config to actually boot. REZ_REDIS_URL
# is set for forward-compat but is not consumed at runtime yet (LivenessBus = S2).
# Multi-node is also gated until PgInboxClaimRegistry/PgSettlementProvider are
# wired (registries are still single-process).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PG_USER:-rez}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD must be set (no insecure default)}
      POSTGRES_DB: ${PG_DB:-rez}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-rez} -d ${PG_DB:-rez}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Redis is a TRUSTED-CLUSTER-INTERNAL component: liveness pings are advisory
  # (nodes re-read from Postgres), but a reachable Redis lets any client forge
  # pings / spoof presence. Keep it on an internal network, password-protected,
  # never exposed to tenants. (Pings carry no ciphertext — items never traverse
  # Redis.)
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set (no insecure default)}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: apply schema migrations, then exit. Nodes wait for this.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["node", "src/cli/index.js", "migrate"]
    environment:
      REZ_PG_URL: postgres://${PG_USER:-rez}:${PG_PASSWORD:?PG_PASSWORD must be set (no insecure default)}@postgres:5432/${PG_DB:-rez}
    depends_on:
      postgres:
        condition: service_healthy

  node1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      REZ_STORAGE_BACKEND: postgres
      REZ_PG_URL: postgres://${PG_USER:-rez}:${PG_PASSWORD:?PG_PASSWORD must be set (no insecure default)}@postgres:5432/${PG_DB:-rez}
      # Shared at-rest cluster key (base64 32 bytes). Same value on every node.
      REZ_STORAGE_ENCRYPTION_KEY: ${REZ_STORAGE_ENCRYPTION_KEY:?REZ_STORAGE_ENCRYPTION_KEY must be set (32-byte base64; openssl rand -base64 32)}
      REZ_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REZ_NODE_ID: node1
      REZ_ADVERTISED_HOST: ${ADVERTISED_HOST:-lb}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  node2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      REZ_STORAGE_BACKEND: postgres
      REZ_PG_URL: postgres://${PG_USER:-rez}:${PG_PASSWORD:?PG_PASSWORD must be set (no insecure default)}@postgres:5432/${PG_DB:-rez}
      # Shared at-rest cluster key (base64 32 bytes). Same value on every node.
      REZ_STORAGE_ENCRYPTION_KEY: ${REZ_STORAGE_ENCRYPTION_KEY:?REZ_STORAGE_ENCRYPTION_KEY must be set (32-byte base64; openssl rand -base64 32)}
      REZ_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REZ_NODE_ID: node2
      REZ_ADVERTISED_HOST: ${ADVERTISED_HOST:-lb}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Non-sticky round-robin LB across the nodes — the whole point of the cluster.
  lb:
    image: nginx:alpine
    ports:
      - "${LB_PORT:-8443}:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node1
      - node2

volumes:
  pgdata: {}
